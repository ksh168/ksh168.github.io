name: Update Citation Counts and Deploy

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs every Sunday at midnight
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    # ── Python: fetch Google Scholar citation counts ──────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install "scholarly" "bibtexparser<2.0.0"

    - name: Update citations
      run: python scripts/update-citations.py

    # ── Commit updated data.json ──────────────────────────────────────────────
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit citation updates
      run: |
        git add src/data/data.json
        git diff --staged --quiet || (git commit -m "Update citation counts [skip ci]" && git push origin master)

    # ── Node: build & deploy React app ───────────────────────────────────────
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build
      env:
        REACT_APP_GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
      run: CI=false npm run build

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}